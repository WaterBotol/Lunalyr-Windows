name: Windows replacement build and smoke

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-replacement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test lyric core and renderer
        run: |
          dotnet run --project tests/Lunalyr.Tests.csproj -c Release
          node --test tests/renderer.test.mjs
      - name: Publish portable x64 build
        run: dotnet publish app/Lunalyr.csproj -c Release -r win-x64 --self-contained true -o artifacts/win-x64
      - name: Exercise the Windows app and desktop
        shell: pwsh
        run: ./scripts/smoke.ps1 -Exe artifacts/win-x64/Lunalyr.exe
      - name: Build per-user installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $iscc installer/Lunalyr.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/Lunalyr-Windows-x64.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke
          path: |
            artifacts/smoke/*.png
            artifacts/smoke/*.txt
            artifacts/smoke/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: Lunalyr-Windows-x64
          path: |
            artifacts/Lunalyr-Windows-x64.zip
            artifacts/installer/*.exe
          if-no-files-found: error
