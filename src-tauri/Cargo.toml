[package]
name = "lunalyr"
description = "Lunalyr for Windows — animated, word-timed lyric wallpapers"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "lunalyr"

[lib]
name = "lunalyr_app"
crate-type = ["rlib"]

[[bin]]
name = "lunalyr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lunalyr-core = { path = "../crates/lunalyr-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
thiserror.workspace = true
env_logger = "0.11"
open = "5"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Globalization",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_Media_Audio",
    "Win32_System_Variant",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# Same versions the `windows` crate already pulls in. `#[implement]` (the
# WASAPI device-change callback) expands to `::windows_core` paths, and the
# media thread names `IAsyncOperation` to wait on WinRT calls with a timeout.
windows-core = "0.62"
windows-future = "0.3"

[features]
# Lets `cargo tauri dev` serve the frontend from Vite.
custom-protocol = ["tauri/custom-protocol"]
