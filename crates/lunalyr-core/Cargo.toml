[package]
name = "lunalyr-core"
description = "Platform-independent lyric model, providers, parsing, ranking, timing and settings for Lunalyr for Windows"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
log.workspace = true
unicode-normalization = "0.1"
unicode-segmentation = "1"
sha2 = "0.10"
async-trait = "0.1"
regex = "1"
# TLS comes from the OS: SChannel on Windows, Security.framework on macOS.
# No ring / aws-lc / openssl, so nothing needs a C toolchain on Windows.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip"] }
# Lyrics+ nodes send gzip bodies without Content-Encoding (miniz_oxide backend).
flate2 = "1"
base64 = "0.22"
# Mandarin readings (MIT); only the tone-marked table is compiled in.
pinyin = { version = "0.11", default-features = false, features = ["with_tone"] }
# Pure-Rust decoders only (zune-jpeg, png, gif, image-webp, bmp).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "webp"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
